<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <style>
    @font-face {
  font-family: 'Inter Tight';
  src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: block;
}
    .btn-label {
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      fill: #FFFFFF;
    }
    .btn-arrow {
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #EF3E5C;
    }
  </style>

  <defs>
    <linearGradient id="btn-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="btn-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="btn-clip">
      <rect x="0" y="0" width="240" height="48" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- Button Glass Base -->
  <g clip-path="url(#btn-clip)">
    <!-- Stage background -->
    <rect width="240" height="48" fill="#0E0E11"/>

    <!-- Crimson under-glow -->
    <circle cx="28" cy="24" r="28" fill="#DC143C" opacity="0.18"/>

    <!-- Glass Tint -->
    <rect width="240" height="48" fill="rgba(255, 255, 255, 0.12)"/>

    <!-- Sweeping sheen highlight -->
    <rect x="-80" y="0" width="60" height="48" fill="url(#btn-sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-120; -120; 320; 320" keyTimes="0; 0.2; 0.45; 1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Rim light stroke -->
  <rect x="0.5" y="0.5" width="239" height="47" rx="23.5" ry="23.5"
        fill="none" stroke="url(#btn-rim)" stroke-width="1"/>

  <!-- Icon (centered vertically) -->
  <g transform="translate(18, 14) scale(0.833)" fill="#FFFFFF">
    <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
  </g>

  <!-- Title & Arrow -->
  <text x="52" y="29" class="btn-label">GitHub</text>
  <text x="216" y="29" class="btn-arrow" text-anchor="end">↗</text>
</svg>
