<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48">
  <style>
    @font-face {
  font-family: 'Inter Tight';
  src: url(data:font/woff2;charset=utf-8;base64,) format('woff2');
  font-weight: 500;
  font-style: normal;
  font-display: block;
}
    .btn-label {
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      fill: #FFFFFF;
    }
    .btn-arrow {
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      font-weight: 700;
      fill: #EF3E5C;
    }
  </style>

  <defs>
    <linearGradient id="btn-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="btn-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="btn-clip">
      <rect x="0" y="0" width="240" height="48" rx="24" ry="24"/>
    </clipPath>
  </defs>

  <!-- Button Glass Base -->
  <g clip-path="url(#btn-clip)">
    <!-- Stage background -->
    <rect width="240" height="48" fill="#0E0E11"/>

    <!-- Crimson under-glow -->
    <circle cx="28" cy="24" r="28" fill="#DC143C" opacity="0.18"/>

    <!-- Glass Tint -->
    <rect width="240" height="48" fill="rgba(255, 255, 255, 0.12)"/>

    <!-- Sweeping sheen highlight -->
    <rect x="-80" y="0" width="60" height="48" fill="url(#btn-sheen)" transform="skewX(-20)">
      <animate attributeName="x" values="-120; -120; 320; 320" keyTimes="0; 0.2; 0.45; 1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Rim light stroke -->
  <rect x="0.5" y="0.5" width="239" height="47" rx="23.5" ry="23.5"
        fill="none" stroke="url(#btn-rim)" stroke-width="1"/>

  <!-- Icon (centered vertically) -->
  <g transform="translate(18, 14) scale(0.833)" fill="#FFFFFF">
    <path d="M1.75 3h20.5c.966 0 1.75.784 1.75 1.75v14a1.75 1.75 0 0 1-1.75 1.75H1.75A1.75 1.75 0 0 1 0 18.75v-14C0 3.784.784 3 1.75 3ZM1.5 7.412V18.75c0 .138.112.25.25.25h20.5a.25.25 0 0 0 .25-.25V7.412l-9.52 6.498a1.75 1.75 0 0 1-1.96 0L1.5 7.412ZM21.49 4.5H2.51l9.49 6.478 9.49-6.478Z"/>
  </g>

  <!-- Title & Arrow -->
  <text x="52" y="29" class="btn-label">Email</text>
  <text x="216" y="29" class="btn-arrow" text-anchor="end">↗</text>
</svg>
